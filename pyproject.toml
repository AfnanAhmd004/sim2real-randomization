[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Sim-to-real transfer for robot control: domain randomization, automatic domain randomization and system identification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["s2r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
